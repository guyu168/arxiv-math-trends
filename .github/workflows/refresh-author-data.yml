name: Refresh historical author data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-author-data.yml
      - src/arxiv_math_trends/harvest.py

permissions:
  contents: write

concurrency:
  group: refresh-author-data
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . datasets
      - run: python scripts/build_historical_from_hf.py
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/authors web/public/data/author_metadata.json data/submissions_h1.csv
          git diff --cached --quiet || git commit -m "Refresh author snapshots from 2010"
          git push
