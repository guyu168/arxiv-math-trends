name: Refresh historical author data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-author-data.yml
      - src/arxiv_math_trends/harvest.py
      - scripts/build_historical_from_hf.py
      - scripts/enrich_orcid.py

permissions:
  contents: write

concurrency:
  group: refresh-author-data
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . datasets
      - run: python scripts/build_historical_from_hf.py
      - uses: actions/upload-artifact@v4
        with:
          name: base-author-snapshots
          path: web/public/data/authors/*.json
          retention-days: 1

  enrich:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: base-author-snapshots
          path: web/public/data/authors
      - run: python scripts/enrich_orcid.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: enriched-${{ matrix.year }}
          path: web/public/data/authors/${{ matrix.year }}.json
          retention-days: 1

  publish-data:
    needs: enrich
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: enriched-*
          path: web/public/data/authors
          merge-multiple: true
      - run: python scripts/write_author_metadata.py
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/authors web/public/data/author_metadata.json data/submissions_h1.csv
          git diff --cached --quiet || git commit -m "Refresh author snapshots from 2010"
          git push

